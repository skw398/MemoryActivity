name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.test-plan }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        test-plan:
          - MemoryActivity
          - MultiLanguages
          - Integration

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up
        run: |
          sw_vers
          xcodebuild -version

      - name: Run ${{ matrix.test-plan }}
        run: |
          xcodebuild test \
            -scheme MemoryActivity \
            -project MemoryActivity.xcodeproj \
            -testPlan "${{ matrix.test-plan }}" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.test-plan }}"
